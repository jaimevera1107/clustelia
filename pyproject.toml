[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clustelia"
dynamic = ["version"]
description = "Clustering search with explicit geometry, reproducible seeds and stability evidence"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jaime Vera-Jaramillo" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["clustering", "model selection", "stability", "gower", "dbcv", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<1.9",
    "joblib>=1.2,<2",
    "threadpoolctl>=3.2,<4",
]

[project.urls]
Homepage = "https://github.com/jaimevera1107/clustelia"
Repository = "https://github.com/jaimevera1107/clustelia"
Issues = "https://github.com/jaimevera1107/clustelia/issues"

[project.optional-dependencies]
density = ["hdbscan==0.8.44"]
fuzzy = ["scikit-fuzzy==0.5.0", "packaging>=23,<27"]
viz = ["matplotlib>=3.8,<4"]
reports = ["openpyxl>=3.1,<4"]
all = ["hdbscan==0.8.44", "scikit-fuzzy==0.5.0", "packaging>=23,<27", "matplotlib>=3.8,<4", "openpyxl>=3.1,<4"]
dev = ["build>=1.2", "twine>=5", "pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.dynamic]
version = { attr = "clustelia._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clustelia = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
# X / D are the scikit-learn conventions for data and distance matrices.
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["clustelia"]

[tool.mypy]
python_version = "3.11"
files = ["src/clustelia"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "joblib", "joblib.*", "threadpoolctl", "hdbscan.*", "skfuzzy.*", "pandas.*"]
ignore_missing_imports = true
