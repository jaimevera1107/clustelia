# Publish ONLY a GitHub Release, after building, testing and version checks.
# Configure PyPI Trusted Publishing with workflow 'release.yml' and
# environment 'pypi'. No API tokens or passwords are required.
name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  verify:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package, test dependencies
        run: python -m pip install ".[all]" pytest hypothesis
      - name: Run complete unittest suite
        run: python -m unittest discover -s tests -v
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: ruff check src tests tools examples
      - run: python tools/check_source.py src/clustelia
  build:
    needs: [verify, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm release tag matches package version
        shell: bash
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('src/clustelia/_version.py')['__version__'])")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: clustelia-release-distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clustelia-release-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
